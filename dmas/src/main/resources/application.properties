spring.application.name=dmas
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/dmas}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:12345}
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true

spring.security.user.name=rohit
spring.security.user.password=rohit

# logging.level.org.springframework.security=TRACE

server.port=${PORT:8080}

# Memory Saving: Reduce DB Connection Pool
# Default is 10 connections; each uses memory. 2-3 is plenty for a portfolio project.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# Web Server Optimization
spring.main.banner-mode=off
spring.jmx.enabled=false